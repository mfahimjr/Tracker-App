<div class="card wrap"><h3>${mgr()?"All leave applications":"My leave applications"}</h3><table style="min-width:760px"><tr>${mgr()?"<th>Employee</th>":""}<th>Type</th><th>Dates</th><th>Period</th><th>Reason</th><th>Attachment</th><th>Relief person</th><th></th></tr>${rows.length?rows.map(l=>`<tr>${mgr()?`<td>${esc(l.who)}</td>`:""}<td>${ltag(l.type)}</td><td>${l.from===l.to?fmt(l.from):fmt(l.from)+" – "+fmt(l.to)}</td><td>${PD[l.pd]}</td><td>${esc(l.why)}</td><td>${l.f?esc(l.f.name):'<span class="mu">none</span>'}</td><td>${esc(l.rel)||'<span class="mu">-</span>'}</td><td>${l.who===me.name?`<button class="g" onclick="edL(${l.i})">Edit</button><button class="g d" onclick="delL(${l.i})">Delete</button>`:""}</td></tr>`).join(""):`<tr><td colspan="${mgr()?8:7}" class="mu">No applications yet.</td></tr>`}</table></div>`},
attendance(){const s=att.find(a=>a.who===me.name&&!a.tout),T=today(),hrs=att.filter(a=>a.who===me.name&&iso(new Date(a.tin))===T).reduce((x,a)=>x+((a.tout||Date.now())-a.tin),0),rows=att.map((a,i)=>({...a,i})).filter(a=>mgr()||a.who===me.name).sort((x,y)=>y.tin-x.tin),m=am&&att.includes(am)?am:(s||rows[0]);
return `<div class="grid"><div class="card"><div class="mu">Status</div><div class="kpi" style="font-size:18px">${s?"Clocked in":"Clocked out"}</div></div><div class="card"><div class="mu">Working place</div><div class="kpi" style="font-size:18px">${s?PL[s.pl]:"-"}</div></div><div class="card"><div class="mu">Hours today</div><div class="kpi">${dur(hrs)}</div></div></div>

<div class="card wrap"><h3>Attendance history</h3><table style="min-width:760px"><tr>${mgr()?"<th>Employee</th>":""}<th>Date</th><th>Place</th><th>Location</th><th>In</th><th>Out</th><th>Duration</th><th></th></tr>${rows.length?rows.map(a=>`<tr>${mgr()?`<td>${esc(a.who)}</td>`:""}<td>${fmt(iso(new Date(a.tin)))}</td><td><span class="tag" style="background:${PC[a.pl]}">${PL[a.pl]}</span></td><td>${a.link?`<a href="${esc(a.link)}" target="_blank" rel="noopener">Google Maps</a>`:'<span class="mu">-</span>'}</td><td>${hm(a.tin)}</td><td>${a.tout?hm(a.tout):'<span class="tag" style="background:var(--s0)">Active</span>'}</td><td>${dur((a.tout||Date.now())-a.tin)}</td><td><button class="g" onclick="am=att[${a.i}];rr()">Map</button></td></tr>`).join(""):'<tr><td colspan="8" class="mu">No attendance yet.</td></tr>'}</table></div></div>
<div class="card"><h3>Location</h3>${m?mapSVG()+`<p style="margin-top:8px"><b>${esc(m.who)}</b> · ${fmt(iso(new Date(m.tin)))} ${hm(m.tin)} · ${PL[m.pl]}</p><p class="mu" style="font-size:12px">${m.lat}, ${m.lng}${m.demo?" (demo location)":""}</p><p style="margin-top:6px"><a href="${m.link?esc(m.link):`https://www.google.com/maps?q=${m.lat},${m.lng}`}" target="_blank" rel="noopener">Open in Google Maps</a></p>`:'<p class="mu">Clock in to record a location.</p>'}</div></div>`},
payroll(){const T=new Date(),Y=T.getFullYear(),maxM=pY<Y?11:T.getMonth(),names=mgr()?(pE==="all"?Object.keys(PAY):[pE]):[me.name].filter(n=>PAY[n]),ms=pM==="all"?[...Array(maxM+1).keys()]:(+pM<=maxM?[+pM]:[]),list=[];

return `<div class="bar-h"><p class="mu">Filter by year and month, then open a sample payslip.</p><div style="display:flex;gap:6px;flex-wrap:wrap">${mgr()?`<select aria-label="Employee" style="width:auto;margin:0" onchange="pE=this.value;rr()"><option value="all" ${pE==="all"?"selected":""}>All employees</option>${Object.keys(PAY).map(n=>`<option ${pE===n?"selected":""}>${esc(n)}</option>`).join("")}</select>`:""}<select aria-label="Year" style="width:auto;margin:0" onchange="pY=+this.value;rr()">${[Y,Y-1].map(y=>`<option ${pY===y?"selected":""}>${y}</option>`).join("")}</select><select aria-label="Month" style="width:auto;margin:0" onchange="pM=this.value;rr()"><option value="all" ${pM==="all"?"selected":""}>All months</option>${MN.map((m,i)=>`<option value="${i}" ${pM===String(i)?"selected":""}>${m}</option>`).join("")}</select></div></div>
<div class="card wrap"><table style="min-width:640px"><tr><th>Period</th>${mgr()?"<th>Employee</th>":""}<th>Basic</th><th>Allowances</th><th>Deductions</th><th>Net pay</th><th></th></tr>${list.length?list.map(x=>`<tr><td>${MN[x.m]} ${x.y}</td>${mgr()?`<td>${esc(x.n)}</td>`:""}<td>${rm(x.b)}</td><td>${rm(x.a)}</td><td>${rm(x.ded)}</td><td><b>${rm(x.net)}</b></td><td><button class="g" onclick="psl('${esc(x.n)}',${x.y},${x.m})">Payslip</button></td></tr>`).join(""):`<tr><td colspan="${mgr()?7:6}" class="mu">No payslips for this selection.</td></tr>`}</table>${list.length?`<p class="mu" style="margin-top:10px">Total net pay for this selection: <b>${rm(list.reduce((a,x)=>a+x.net,0))}</b>. Sample figures only.</p>`:""}</div>`},
relations(){const rows=RL.map((r,i)=>({...r,i})).filter(r=>r.g===rel);return `<div class="bar-h"><div>${["Staff","Partner","Client"].map(k=>`<button class="${k===rel?"p":""}" onclick="rel='${k}';rr()">${k}</button> `).join("")}</div><button class="p" onclick="addRL()">Add contact</button></div><div class="card wrap"><table><tr><th>Name</th><th>Designation</th><th>Contact</th><th>Organisation</th><th>Email</th><th></th></tr>${rows.length?rows.map(r=>`<tr><td><b>${esc(r.n)}</b></td><td>${esc(r.d)}</td><td>${esc(r.p)}</td><td>${esc(r.o)}</td><td>${esc(r.e)}</td><td><button class="g" onclick="edRL(${r.i})">Edit</button><button class="g d" onclick="delRL(${r.i})">Delete</button></td></tr>`).join(""):'<tr><td colspan="6" class="mu">No contacts yet.</td></tr>'}</table></div>`},
billing(){const sm=sub.filter(x=>x.s==="Active").reduce((a,x)=>a+x.amt/({Monthly:1,Quarterly:3,Yearly:12}[x.cy]||1),0),tx=txn.map((t,i)=>({...t,i})).sort((a,b)=>b.d.localeCompare(a.d));return `<div class="bar-h"><p class="mu">Invoices, subscriptions, transactions and costing.</p></div><div class="card wrap"><div class="bar-h"><h3 style="margin:0">Invoices</h3><button class="p" onclick="addI()">+ Add invoice</button></div><table><tr><th>No.</th><th>Project</th><th>Amount</th><th>File</th><th>Status</th><th></th></tr>
${inv.map((v,i)=>`<tr><td>${esc(v.no)}</td><td>${esc(v.pr)}</td><td>RM ${(+v.amt).toLocaleString()}</td><td>${v.f?" "+esc(v.f.name):'<span class="mu">none</span>'}</td><td><span class="tag" style="background:${tagc(v.s)}">${v.s}</span></td><td><button class="g" onclick="edI(${i})">Edit</button><button class="g d" onclick="delI(${i})">Delete</button></td></tr>`).join("")}</table>
<div class="bar-h" style="margin-top:28px"><h3 style="margin:0">Subscriptions</h3><button class="p" onclick="addS()">+ Add subscription</button></div><table style="min-width:680px"><tr><th>Subscription</th><th>Vendor</th><th>Amount</th><th>Cycle</th><th>Next billing</th><th>Status</th><th></th></tr>${sub.length?sub.map((x,i)=>`<tr><td><b>${esc(x.n)}</b></td><td>${esc(x.v)||'<span class="mu">-</span>'}</td><td>${rm(+x.amt)}</td><td>${esc(x.cy)}</td><td>${fmt(x.nx)}</td><td><span class="tag" style="background:${tagc(x.s)}">${esc(x.s)}</span></td><td><button class="g" onclick="edS(${i})">Edit</button><button class="g d" onclick="delS(${i})">Delete</button></td></tr>`).join(""):'<tr><td colspan="7" class="mu">No subscriptions yet.</td></tr>'}</table><p class="mu" style="margin-top:10px">Active subscriptions cost about <b>${rm(sm)}</b> per month.</p>
<div class="bar-h" style="margin-top:28px"><h3 style="margin:0">Transactions</h3><button class="p" onclick="addX()">+ Add transaction</button></div><table style="min-width:760px"><tr><th>Date</th><th>Description</th><th>Project</th><th>Type</th><th>Amount</th><th>Status</th><th></th></tr>${tx.length?tx.map(t=>`<tr><td>${fmt(t.d)}</td><td>${esc(t.ds)}</td><td>${esc(t.pr)}</td><td><span class="tag" style="background:${tagc(t.ty)}">${esc(t.ty)}</span></td><td>${t.ty==="Expense"?"- ":"+ "}${rm(+t.amt)}</td><td><span class="tag" style="background:${tagc(t.s)}">${esc(t.s)}</span></td><td><button class="g" onclick="edX(${t.i})">Edit</button><button class="g d" onclick="delX(${t.i})">Delete</button></td></tr>`).join(""):'<tr><td colspan="7" class="mu">No transactions yet.</td></tr>'}</table></div>
<div class="card wrap"><h3>Costing calculator</h3><div style="display:grid;gap:0 14px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))"><div><label>Man-days</label><input id="h" type="number" value="20" oninput="calc()"></div><div><label>Rate (RM/day)</label><input id="r" type="number" value="900" oninput="calc()"></div><div><label>Other costs (RM)</label><input id="o" type="number" value="2000" oninput="calc()"></div></div><div class="mu" style="margin-top:6px">Total</div><div class="kpi" id="tot"></div></div>`},

<div class="card wrap"><table><tr><th>Name</th><th>Description</th><th></th></tr>${n.fo.length||n.fl.length?n.fo.map((f,i)=>`<tr><td><a href="#" onclick="opD(${i});return false"><b>${esc(f.n)}</b></a></td><td class="mu">${f.fo.length} folders · ${fcnt(f)} files</td><td><button class="g" onclick="renD(${i})">Rename</button><button class="g d" onclick="delD(${i})">Delete</button></td></tr>`).join("")+n.fl.map((x,i)=>`<tr><td>${esc(x.name)}</td><td>${esc(x.note)}</td><td><button class="g" onclick="edF(${i})">Edit</button><button class="g d" onclick="delF(${i})">Delete</button></td></tr>`).join(""):'<tr><td colspan="3" class="mu">Empty. Create a folder or upload a file.</td></tr>'}</table></div>`},

return `<div class="card"><h3>Inbox</h3>${mine.length?mine.map(r=>`<div class="ann"><b>${esc(r.x)}</b><br><span class="mu" style="font-size:12px">from ${esc(r.by)} · ${esc(r.w.replace("T"," "))}</span></div>`).join(""):'<p class="mu">Nothing for you.</p>'}<div class="ann"><b>INV-0043 is overdue</b></div></div>

profile(){const rows=[["Full name","name"],["Mobile phone","phone"],["Email","email"]];
return `<div class="card pf"><div class="av big">${avc()}</div><div style="flex:1"><h2>${esc(me.name)}</h2><p class="mu">${me.role} · ${esc(me.email)}</p></div><div><button onclick="$('pic').click()">Change photo</button> ${me.pic?'<button class="g d" onclick="me.pic=null;rr()">Remove</button>':""} <button class="p" onclick="edAll()">Edit profile</button></div><input type="file" id="pic" accept="image/*" hidden onchange="setPic(this)"></div>

<div class="card"><h3>Notification settings</h3>${[["inbox","In-app inbox alerts","Show reminders and alerts assigned to you"],["gmail","Email me via Gmail","Receive reminders in your email"],["ann","Announcement updates","New announcements and approval decisions"],["inv","Billing alerts","Overdue and newly added invoices"]].map(n=>`<div class="bar-h"><div>${n[1]}<br><span class="mu">${n[2]}</span></div><input type="checkbox" style="width:18px;height:18px;margin:0" ${me.np[n[0]]?"checked":""} onchange="me.np['${n[0]}']=this.checked"></div>`).join("")}<label>Remind me</label><select onchange="me.np.lead=this.value">${["At due time","1 hour before","1 day before"].map(o=>`<option ${me.np.lead===o?"selected":""}>${o}</option>`).join("")}</select></div>
${V.notif()}
<div class="card"><h3>Preferences</h3><div class="bar-h"><div>Theme<br><span class="mu">Switch between light and dark</span></div><button onclick="theme()">Switch theme</button></div><div class="bar-h"><div>Session<br><span class="mu">Sign out of this device</span></div><button class="d" onclick="logout()">Log out</button></div></div>`}};
